name: Deploy to AWS

# Runs only after CI has passed on main, so a red build cannot reach the
# instance. `workflow_run` is what enforces that ordering - a plain
# `on: push` job would race CI and deploy broken code.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push images
    # workflow_dispatch has no upstream conclusion, hence the second clause.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.tags.outputs.api_image }}
      web_image: ${{ steps.tags.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run, the default checkout is the workflow file's ref,
          # not the commit that triggered CI. Pin it explicitly so the deployed
          # image matches the commit that actually passed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute image tags
        id: tags
        run: |
          # GHCR requires a lowercase repository path; owner names are not
          # guaranteed to be lowercase.
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "api_image=${REGISTRY}/${repo}-api:${sha}" >> "$GITHUB_OUTPUT"
          echo "web_image=${REGISTRY}/${repo}-web:${sha}" >> "$GITHUB_OUTPUT"
          echo "api_repo=${REGISTRY}/${repo}-api" >> "$GITHUB_OUTPUT"
          echo "web_repo=${REGISTRY}/${repo}-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The API image is built here rather than on the instance because it
      # compiles wheels and bakes ~100 MB of model weights - work that a 1 vCPU
      # / 1 GB free-tier box cannot complete reliably.
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.api_image }}
            ${{ steps.tags.outputs.api_repo }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push dashboard
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.web_image }}
            ${{ steps.tags.outputs.web_repo }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Roll out on EC2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Roll out over SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          API_IMAGE: ${{ needs.build.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST" || { echo "::error::secret EC2_HOST is not set"; exit 1; }

          install -m 600 /dev/null key.pem
          # tr -d '\r' is not paranoia. The secret is normally pasted from a
          # Windows machine, where the clipboard normalises line endings to
          # CRLF even when the .pem on disk is LF-clean. OpenSSH then fails
          # with `Load key "key.pem": error in libcrypto` and falls through to
          # "Permission denied (publickey)", which reads like a wrong or
          # unauthorised key rather than the byte-level problem it actually is.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > key.pem

          # Fail on a malformed secret here, with a message that says what to
          # do, rather than letting ssh report it as an auth failure.
          if ! ssh-keygen -y -f key.pem >/dev/null 2>&1; then
            echo "::error::EC2_SSH_KEY is not a usable private key. Re-add the secret with the COMPLETE .pem contents, including the -----BEGIN----- and -----END----- lines."
            exit 1
          fi
          echo "private key parsed OK"

          # The variables are prepended to the script on STDIN rather than
          # passed as ssh arguments, so the registry token never shows up in
          # the remote process list. %q quotes them for safe reuse as shell
          # input.
          #
          # accept-new pins the host key on first contact and verifies it on
          # every later run, so a changed host key fails the deploy instead of
          # being silently accepted.
          {
            printf 'API_IMAGE=%q\n' "$API_IMAGE"
            printf 'WEB_IMAGE=%q\n' "$WEB_IMAGE"
            printf 'GHCR_USER=%q\n' "$GHCR_USER"
            printf 'GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            cat <<'REMOTE'
            cd /opt/atlas

            # Source is still pulled so the Caddyfile, compose file and
            # migrations on the box match the images being deployed.
            git fetch --quiet origin main
            git reset --hard --quiet origin/main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pin this rollout's images without editing the committed env file.
            # A generated override file keeps .env.aws (secrets) untouched.
            umask 077
            {
              echo "ATLAS_API_IMAGE=$API_IMAGE"
              echo "ATLAS_WEB_IMAGE=$WEB_IMAGE"
            } > .env.images

            compose() {
              docker compose -f docker-compose.aws.yml \
                --env-file .env.aws --env-file .env.images "$@"
            }

            compose pull api web
            compose up -d --remove-orphans

            # Reclaim the previous image. A 30 GB volume fills after a handful
            # of 1.3 GB API images otherwise.
            docker image prune -af --filter "until=24h" || true

            # Do NOT poll http://127.0.0.1/ready. Once ATLAS_SITE_ADDRESS names
            # real hostnames, Caddy serves only those and a request to the loop-
            # back address matches no site - so the gate fails on a rollout that
            # actually worked. Check the app directly through the container, then
            # confirm the public URL end to end.
            public_url=$(grep -E '^ATLAS_PUBLIC_URL=' .env.aws | cut -d= -f2- | tr -d '"' | tr -d "'" | tr -d '\r' | tr -d ' ')

            echo "--- waiting for the API to report ready ---"
            ready=""
            for attempt in $(seq 1 40); do
              if compose exec -T api curl -fsS --max-time 5 http://127.0.0.1:8000/ready >/dev/null 2>&1; then
                echo "api ready after ${attempt} attempt(s)"
                compose exec -T api curl -fsS http://127.0.0.1:8000/ready
                echo
                ready=yes
                break
              fi
              sleep 15
            done

            if [ -n "$ready" ]; then
              # The app is up. Now prove the public path (TLS, routing) works.
              if [ -n "$public_url" ] && curl -fsS --max-time 20 "${public_url}/ready" >/dev/null 2>&1; then
                echo "public URL healthy: ${public_url}/ready"
              elif [ -n "$public_url" ]; then
                echo "::warning::API is ready but ${public_url}/ready did not respond - check DNS, the certificate, or the security group."
              fi
              exit 0
            fi

            echo "::error::the API did not become ready"
            docker compose -f docker-compose.aws.yml --env-file .env.aws --env-file .env.images ps
            docker compose -f docker-compose.aws.yml --env-file .env.aws --env-file .env.images logs --tail=80 api
            exit 1
          REMOTE
          } | ssh -i key.pem -o StrictHostKeyChecking=accept-new \
                  "${EC2_USER:-ec2-user}@${EC2_HOST}" \
                  'bash -euo pipefail -s'

      - name: Remove the key
        if: always()
        run: rm -f key.pem
